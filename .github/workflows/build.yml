name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 34 + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Gate — components merged into manifest
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK=$APK"
          ls -la "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)
          echo "AAPT2=$AAPT2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/tree.txt
          grep -q "MiniApp" /tmp/tree.txt
          grep -q "StubActivity\$C0" /tmp/tree.txt
          grep -q "StubActivity\$C1" /tmp/tree.txt
          grep -q ":p0" /tmp/tree.txt
          echo "gate ok: MiniApp + StubActivity\$C0/C1 + :p0 present"

      - name: Gate — classes present in dex
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          ls -la /tmp/dex
          # ยืนยันว่า class ของ hook ถูก compile เข้า dex จริง
          for c in HookManager IActivityManagerProxy IPackageManagerProxy InstrumentationProxy HCallbackProxy GuestRuntime GuestResources StubActivity; do
            if grep -aq "$c" /tmp/dex/classes*.dex; then echo "ok $c"; else echo "MISSING $c"; exit 1; fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherPort-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
