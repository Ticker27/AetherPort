name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner ของ GitHub มี Android SDK ติดมาอยู่แล้ว — ใช้ตัวนั้นตรง ๆ
      # (ไม่ใช้ android-actions/setup-android@v3 เพราะมันเรียก `sdkmanager tools` ซึ่งเลิกมีแล้ว)
      - name: Android SDK (preinstalled) + platform 34
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses --sdk_root="$ANDROID_HOME" > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Gate — components merged into manifest
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK=$APK"
          ls -la "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)
          echo "AAPT2=$AAPT2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/tree.txt
          grep -q "MiniApp" /tmp/tree.txt
          grep -q 'StubActivity\$C0' /tmp/tree.txt
          grep -q 'StubActivity\$C1' /tmp/tree.txt
          grep -q ":p0" /tmp/tree.txt
          echo "gate ok: MiniApp + StubActivity\$C0/C1 + :p0 present"

      - name: Gate — hook classes present in dex
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          ls -la /tmp/dex
          for c in HookManager IActivityManagerProxy IPackageManagerProxy InstrumentationProxy HCallbackProxy GuestRuntime GuestResources StubActivity StubActivityRecord; do
            if grep -aq "$c" /tmp/dex/classes*.dex; then echo "ok $c"; else echo "MISSING $c"; exit 1; fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherPort-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
