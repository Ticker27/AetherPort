plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virtualapp.mini'
    compileSdk 34

    defaultConfig {
        applicationId "com.virtualapp.mini"
        minSdk 28          // AetherEngine: minSdk 28 (arm64 only)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

// ไม่มี external dependency: ใช้ framework Activity/View ล้วน
// (ลดชั้น build + ไม่ต้องการ appcompat สำหรับ container console)
dependencies {
}
